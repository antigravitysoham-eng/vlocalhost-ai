<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signal lost (404) — Vlocalhost.AI</title>
<meta name="description" content="That page isn't here. Head back to Vlocalhost.AI." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#090C12" />
<link rel="icon" type="image/svg+xml" href="/vlocalhost-site/assets/favicon.svg" />
<style>
  :root{
    --bg:#090C12; --bg-2:#0E1220; --ink:#EAEEF4; --muted:#7E8AA0; --faint:#4B5468;
    --line:rgba(255,255,255,0.075); --amber:#FFB43D; --cyan:#38E1CE;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    display:grid; place-items:center; padding:32px;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),
                     linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:40px 40px;
  }
  .card{max-width:560px; text-align:center}
  .chip{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--mono);
    font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan);
    border:1px solid #1E4E4A; background:#0C1A1C; border-radius:999px; padding:7px 14px;
  }
  .chip i{width:6px;height:6px;border-radius:50%;background:var(--cyan);font-style:normal}
  svg.trace{width:100%; max-width:420px; margin:34px auto 10px; display:block}
  h1{font-size:clamp(30px,6vw,44px); margin:0 0 12px; letter-spacing:-.02em}
  p{color:var(--muted); font-size:16px; line-height:1.65; margin:0 auto 30px; max-width:44ch}
  .row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  a.btn{
    font-size:14.5px; font-weight:600; text-decoration:none; border-radius:11px;
    padding:11px 20px; border:1px solid var(--line); color:var(--ink);
    background:var(--bg-2); transition:border-color .18s ease, transform .18s ease;
  }
  a.btn:hover{border-color:rgba(255,255,255,.22); transform:translateY(-1px)}
  a.btn.primary{background:var(--amber); color:#0B0F18; border-color:transparent}
  code{font-family:var(--mono); color:var(--faint); font-size:12.5px}
  @media (prefers-reduced-motion:no-preference){
    svg.trace path{stroke-dasharray:600; stroke-dashoffset:600; animation:draw 1.6s ease forwards}
  }
  @keyframes draw{to{stroke-dashoffset:0}}
</style>
</head>
<body>
  <div class="card">
    <span class="chip"><i></i>No signal</span>

    <svg class="trace" viewBox="0 0 400 80" fill="none" aria-hidden="true">
      <line x1="0" y1="40" x2="400" y2="40" stroke="#1B2231" stroke-width="1.5"/>
      <path d="M0 40 H92 l10-22 12 44 14-34 9 20 8-12 10 4"
            stroke="#FFB43D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M175 40 H400" stroke="#2A3244" stroke-width="2.6"
            stroke-linecap="round" stroke-dasharray="5 9"/>
    </svg>

    <h1>The trace goes flat here</h1>
    <p>
      That page doesn't exist — or it moved when the site did. Nothing was recorded,
      and nothing left your machine.
    </p>
    <div class="row">
      <a class="btn primary" href="/vlocalhost-site/">Back to Vlocalhost.AI</a>
      <a class="btn" href="/vlocalhost-site/install/">Install</a>
      <a class="btn" href="/vlocalhost-site/pricing/">Pricing</a>
    </div>
    <p style="margin-top:28px"><code>404 · page not found</code></p>
  </div>
</body>
</html>
